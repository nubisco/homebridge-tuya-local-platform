name: Bug Report
description: Report a problem with the plugin
labels: [bug]
assignees: [joseporto]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight checklist
      options:
        - label: I am running the latest version of the plugin
          required: true
        - label: I have searched existing issues and this hasn't been reported yet
          required: true
        - label: I have read the [documentation](https://nubisco.github.io/homebridge-tuya-local-platform/)
          required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Device type
      description: The `type` value from your device config
      options:
        - outlet
        - simplelight
        - rgbtwlight
        - rgbtwoutlet
        - twlight
        - multioutlet
        - custommultioutlet
        - airconditioner
        - airpurifier
        - dehumidifier
        - convector
        - garagedoor
        - simpledimmer
        - simpledimmer2
        - simpleblinds
        - simpleheater
        - mappedheatpumpheater
        - circuitbreakermonitor
        - switch
        - fan
        - fanlight
        - watervalve
        - oildiffuser
        - Other / not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the problem
      placeholder: When I try to turn on my outlet, the plugin logs an error and the device does not respond.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What steps consistently trigger this issue?
      placeholder: |
        1. Add device with type `outlet` and id `xxx`
        2. Restart Homebridge
        3. Toggle the switch in the Home app
        4. See error in logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Homebridge logs
      description: Paste relevant log output (run Homebridge with `-D` for debug logs)
      render: text

  - type: textarea
    id: config
    attributes:
      label: Device config (redacted)
      description: Paste your device config from `config.json` — replace `id` and `key` with `REDACTED`
      render: json

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: homebridge-version
    attributes:
      label: Homebridge version
      placeholder: '1.8.0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: '22.0.0'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Raspberry Pi OS 12 / macOS 15 / Docker'
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else that might help
