name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# One release at a time. Every push to master publishes, so two quick merges
# would otherwise start two semantic-release runs that race for the same tag
# and changelog commit. A run that is already going is never cancelled, since
# that could stop a publish halfway. A newer push waits behind it instead. If
# a third push lands while one is waiting, GitHub replaces the waiting run with
# the newest one, which is safe: it checks out the latest commit and releases
# everything since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the npm bundled with
      # Node 22 is older, so upgrade before publishing. PINNED, not @latest:
      # on 2026-07-10 `npm@latest` briefly resolved to the broken npm@13.1.5,
      # whose provenance code crashes with "Cannot find module 'sigstore'" and
      # failed the release. Pinning keeps the pipeline reproducible and immune to
      # npm shipping a bad `latest`. Bump deliberately when needed.
      - name: Install pinned npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - run: npm ci
      - run: npm run build

      # No NPM_TOKEN. Publishing authenticates via OIDC against the trusted
      # publisher configured for this package on npmjs.com, matching @nubisco/ui.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
